x-vault-base: &vault-base
  image: ${VAULT_IMAGE:-hashicorp/vault:2.2}
  restart: unless-stopped
  cap_add:
    - IPC_LOCK
  ports:
    - "127.0.0.1:8200:8200"
  environment:
    VAULT_DEV_ROOT_TOKEN_ID: root
    VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    VAULT_ADDR: http://127.0.0.1:8200
  command: ["server", "-dev"]
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 128M
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8200/v1/sys/health || exit 1"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  # Companion PostgreSQL container for Dynamic Secrets Engine
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    profiles: ["dynamic-creds"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab_db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab_db"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - vault-pg-data:/var/lib/postgresql

  # Profile 1: Dynamic Secrets Engine & Lease Revocation Cascades
  vault-dynamic:
    <<: *vault-base
    profiles: ["dynamic-creds"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - vault-dynamic-data:/vault/file

  # Profile 2: Token TTL, Renewable Leases & Max TTL Ceilings
  vault-token:
    <<: *vault-base
    profiles: ["token-lifecycle"]
    volumes:
      - vault-token-data:/vault/file

  # Profile 3: Transit Encryption-as-a-Service (EaaS) Throughput & Key Rotation
  vault-transit:
    <<: *vault-base
    profiles: ["transit-crypto"]
    volumes:
      - vault-transit-data:/vault/file

volumes:
  vault-pg-data:
  vault-dynamic-data:
  vault-token-data:
  vault-transit-data:
