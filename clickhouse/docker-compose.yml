x-clickhouse-base: &clickhouse-base
  image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.9.23.15}
  restart: unless-stopped
  ports:
    - "127.0.0.1:8123:8123"
    - "127.0.0.1:9000:9000"
  environment:
    CLICKHOUSE_DB: default
    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  # Profile: parts-limit - Exp 01: Too Many Parts Failure
  # Limits: parts_to_throw_insert=120, parts_to_delay_insert=80
  # Objective: Tests un-batched inserts triggering TOO_MANY_PARTS failure
  # Runner: make up EXP=parts-limit && make run SCRIPT=01_parts_explosion
  parts-limit:
    <<: *clickhouse-base
    profiles: ["parts-limit"]
    volumes:
      - clickhouse-parts-data:/var/lib/clickhouse

  # Profile: memory-cap - Exp 02: Analytical Memory Limit & Disk Spill
  # Limits: max_memory_usage=64MB, max_bytes_before_external_group_by=32MB
  # Objective: Triggers MEMORY_LIMIT_EXCEEDED; tests external group by disk spilling
  # Runner: make up EXP=memory-cap && make run SCRIPT=02_memory_limit
  memory-cap:
    <<: *clickhouse-base
    profiles: ["memory-cap"]
    volumes:
      - ./users.d/memory-limit.xml:/etc/clickhouse-server/users.d/memory-limit.xml:ro
      - clickhouse-mem-data:/var/lib/clickhouse

  # Profile: compression - Exp 03: Columnar Compression Codecs & LowCardinality
  # Limits: 512MB RAM, 1.0 CPU
  # Objective: Compares disk footprint across Default, ZSTD, Gorilla, DoubleDelta, and LowCardinality
  # Runner: make up EXP=compression && make run SCRIPT=03_codec_compression
  compression:
    <<: *clickhouse-base
    profiles: ["compression"]
    volumes:
      - clickhouse-compression-data:/var/lib/clickhouse

volumes:
  clickhouse-parts-data:
  clickhouse-mem-data:
  clickhouse-compression-data:
