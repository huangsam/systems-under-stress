x-clickhouse-base: &clickhouse-base
  image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.9.23.15}
  restart: unless-stopped
  ports:
    - "127.0.0.1:8123:8123"
    - "127.0.0.1:9000:9000"
  environment:
    CLICKHOUSE_DB: default
    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  # Experiment 1: Un-batched inserts and parts explosion limit
  parts-limit:
    <<: *clickhouse-base
    profiles: ["parts-limit"]
    volumes:
      - clickhouse-parts-data:/var/lib/clickhouse

  # Experiment 2: Analytical memory ceiling (64MB max_memory_usage) & disk spill
  memory-cap:
    <<: *clickhouse-base
    profiles: ["memory-cap"]
    volumes:
      - ./users.d/memory-limit.xml:/etc/clickhouse-server/users.d/memory-limit.xml:ro
      - clickhouse-mem-data:/var/lib/clickhouse

  # Experiment 3: Columnar Compression Codecs & LowCardinality Benchmarking
  compression:
    <<: *clickhouse-base
    profiles: ["compression"]
    volumes:
      - clickhouse-compression-data:/var/lib/clickhouse

volumes:
  clickhouse-parts-data:
  clickhouse-mem-data:
  clickhouse-compression-data:
