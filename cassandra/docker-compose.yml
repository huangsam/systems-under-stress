x-cassandra-base: &cassandra-base
  image: ${CASSANDRA_IMAGE:-cassandra:5.0.9}
  restart: unless-stopped
  ports:
    - "127.0.0.1:9042:9042"
  deploy:
    resources:
      limits:
        cpus: '1.5'
        memory: 1280M
  environment:
    - MAX_HEAP_SIZE=512M
  healthcheck:
    test: ["CMD-SHELL", "cqlsh -e \"DESCRIBE KEYSPACES\" || nodetool status | grep -q \"UN\" || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 25
    start_period: 30s

services:
  # Profile: tombstones - Exp 01: Tombstone Failure Threshold
  # Limits: 10,000 tombstone read abort ceiling, 512MB heap
  # Objective: Triggers ReadFailureException when scanning 12,000 tombstones; tests clustering slice fix
  # Runner: make up EXP=tombstones && make run SCRIPT=01_tombstone_threshold
  cassandra-tombstones:
    <<: *cassandra-base
    container_name: cassandra-tombstones
    profiles: ["tombstones", "default"]
    environment:
      - CASSANDRA_CLUSTER_NAME=TombstoneCluster
      - MAX_HEAP_SIZE=512M
    volumes:
      - cassandra-tombstone-data:/var/lib/cassandra

  # Profile: cluster-consistency - Exp 02: Tunable Consistency & PACELC 3-Node Cluster
  # Limits: 3 nodes (RF=3), 896MB RAM / 384MB heap per node, simulated node outages via docker stop
  # Objective: Tests quorum availability across ONE, QUORUM, ALL during rolling node degradation
  # Runner: make up EXP=cluster-consistency && make run SCRIPT=02_consistency_levels
  cassandra-node1:
    <<: *cassandra-base
    container_name: cassandra-node1
    profiles: ["cluster-consistency"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 896M
    environment:
      - CASSANDRA_CLUSTER_NAME=LabCluster
      - CASSANDRA_SEEDS=cassandra-node1
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - MAX_HEAP_SIZE=384M
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra-n1-data:/var/lib/cassandra

  cassandra-node2:
    <<: *cassandra-base
    container_name: cassandra-node2
    profiles: ["cluster-consistency"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 896M
    environment:
      - CASSANDRA_CLUSTER_NAME=LabCluster
      - CASSANDRA_SEEDS=cassandra-node1
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - MAX_HEAP_SIZE=384M
    ports: []
    volumes:
      - cassandra-n2-data:/var/lib/cassandra
    depends_on:
      cassandra-node1:
        condition: service_healthy

  cassandra-node3:
    <<: *cassandra-base
    container_name: cassandra-node3
    profiles: ["cluster-consistency"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 896M
    environment:
      - CASSANDRA_CLUSTER_NAME=LabCluster
      - CASSANDRA_SEEDS=cassandra-node1
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - MAX_HEAP_SIZE=384M
    ports: []
    volumes:
      - cassandra-n3-data:/var/lib/cassandra
    depends_on:
      cassandra-node1:
        condition: service_healthy

  # Profile: wide-partitions - Exp 03: Wide Partitions & Hot-Spotting
  # Limits: 512MB heap, single-partition row accumulation
  # Objective: Compares unbounded single-partition writes against deterministic multi-bucket hashing
  # Runner: make up EXP=wide-partitions && make run SCRIPT=03_partition_skew
  cassandra-wide:
    <<: *cassandra-base
    container_name: cassandra-wide
    profiles: ["wide-partitions"]
    environment:
      - CASSANDRA_CLUSTER_NAME=WidePartitionCluster
      - MAX_HEAP_SIZE=512M
    volumes:
      - cassandra-wide-data:/var/lib/cassandra

volumes:
  cassandra-tombstone-data:
  cassandra-n1-data:
  cassandra-n2-data:
  cassandra-n3-data:
  cassandra-wide-data:
