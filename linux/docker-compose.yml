x-linux-base: &linux-base
  image: ${LINUX_IMAGE:-debian-kernel-lab:trixie}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  working_dir: /lab
  volumes:
    - .:/lab:ro
  command: ["sleep", "infinity"]
  healthcheck:
    test: ["CMD-SHELL", "test -d /proc && python3 --version && uv --version"]
    interval: 2s
    timeout: 2s
    retries: 5

services:
  # Profile: pid-limit - Exp 01: Cgroups PID Limit & Contained Fork Bomb
  # Limits: cgroups v2 pids.max=40, 64MB RAM, 0.5 CPU
  # Objective: Tests kernel EAGAIN fork bomb containment
  # Runner: cd linux && make up EXP=pid-limit && make run SCRIPT=01_fork_bomb_cgroup
  pid-limit:
    <<: *linux-base
    container_name: linux-pid-limit
    profiles: ["pid-limit"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
          pids: 40

  # Profile: fd-exhaustion - Exp 02: File Descriptor & Inode Limits
  # Limits: ulimit -n 64, 64MB RAM
  # Objective: Triggers EMFILE and tests leak prevention with context managers
  # Runner: cd linux && make up EXP=fd-exhaustion && make run SCRIPT=02_fd_limits
  fd-exhaustion:
    <<: *linux-base
    container_name: linux-fd-exhaustion
    profiles: ["fd-exhaustion"]
    ulimits:
      nofile:
        soft: 64
        hard: 64
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  # Profile: oom-killer - Exp 03: Kernel OOM Killer & Swap Behavior
  # Limits: 32MB RAM, memswap_limit=32M, 0.5 CPU
  # Objective: Stresses strict container memory ceiling and triggers kernel SIGKILL
  # Runner: cd linux && make up EXP=oom-killer && make run SCRIPT=03_oom_killer
  oom-killer:
    <<: *linux-base
    container_name: linux-oom-killer
    profiles: ["oom-killer"]
    memswap_limit: 32M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 32M
