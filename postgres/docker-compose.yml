x-postgres-base: &postgres-base
  image: ${POSTGRES_IMAGE:-postgres:18.6}
  restart: unless-stopped
  ports:
    - "127.0.0.1:5432:5432"
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: lab_db
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 256M
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d lab_db"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  # Profile: isolation - Exp 01: Transaction Isolation & Write Skew
  # Limits: 256MB RAM, 1.0 CPU
  # Objective: Tests Write Skew under REPEATABLE READ vs SSI prevention (SQLSTATE 40001)
  # Runner: make up EXP=isolation && make run SCRIPT=01_isolation
  isolation:
    <<: *postgres-base
    profiles: ["isolation"]
    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
      - postgres-isolation-data:/var/lib/postgresql

  # Profile: locks - Exp 02: Row Lock Contention & Deadlock Detection
  # Limits: deadlock_timeout=100ms, log_lock_waits=on
  # Objective: Stresses hot-row locks and catches SQLSTATE 40P01 deadlock aborts
  # Runner: make up EXP=locks && make run SCRIPT=02_locks
  locks:
    <<: *postgres-base
    profiles: ["locks"]
    command: >
      postgres
      -c deadlock_timeout=100ms
      -c log_lock_waits=on
    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
      - postgres-locks-data:/var/lib/postgresql

  # Profile: work-mem - Exp 03: PostgreSQL work_mem & Disk Spill
  # Limits: work_mem=4MB, log_temp_files=0
  # Objective: Forces external merge disk spills during sorting
  # Runner: make up EXP=work-mem && make run SCRIPT=03_work_mem
  work-mem:
    <<: *postgres-base
    profiles: ["work-mem"]
    command: >
      postgres
      -c work_mem=4MB
      -c log_temp_files=0
    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
      - postgres-work-mem-data:/var/lib/postgresql

volumes:
  postgres-isolation-data:
  postgres-locks-data:
  postgres-work-mem-data:
