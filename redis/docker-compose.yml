x-redis-base: &redis-base
  image: ${REDIS_IMAGE:-redis:8.10.2}
  restart: unless-stopped
  ports:
    - "127.0.0.1:6379:6379"
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 64M
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 2s
    timeout: 2s
    retries: 5

services:
  # Profile: eviction-lru - Exp 01A: Least Recently Used Eviction
  # Limits: 16MB maxmemory, allkeys-lru eviction policy
  # Objective: Tests transparent memory stabilization and high hit-ratio under 80/20 load
  # Runner: make up EXP=eviction-lru && make run SCRIPT=01_eviction
  eviction-lru:
    <<: *redis-base
    profiles: ["eviction-lru", "eviction"]
    command: >
      redis-server
      --maxmemory 16mb
      --maxmemory-policy allkeys-lru
      --loglevel notice
    volumes:
      - redis-eviction-lru-data:/data

  # Profile: eviction-noeviction - Exp 01B: Memory Limit OOM Error
  # Limits: 16MB maxmemory, noeviction policy
  # Objective: Triggers explicit Redis OOM errors once 16MB ceiling is hit
  # Runner: make up EXP=eviction-noeviction && make run SCRIPT=01_eviction
  eviction-noeviction:
    <<: *redis-base
    profiles: ["eviction-noeviction"]
    command: >
      redis-server
      --maxmemory 16mb
      --maxmemory-policy noeviction
      --loglevel notice
    volumes:
      - redis-eviction-noeviction-data:/data

  # Profile: eviction-lfu - Exp 01C: Least Frequently Used Eviction
  # Limits: 16MB maxmemory, allkeys-lfu policy
  # Objective: Tests logarithmic counter eviction protecting frequent keys regardless of recency
  # Runner: make up EXP=eviction-lfu && make run SCRIPT=01_eviction
  eviction-lfu:
    <<: *redis-base
    profiles: ["eviction-lfu"]
    command: >
      redis-server
      --maxmemory 16mb
      --maxmemory-policy allkeys-lfu
      --loglevel notice
    volumes:
      - redis-eviction-lfu-data:/data

  # Profile: stampede - Exp 02: Cache Stampede & Distributed Mutex
  # Limits: 64MB maxmemory
  # Objective: Simulates 100 concurrent requests on expired hot keys comparing naive vs lock vs XFetch
  # Runner: make up EXP=stampede && make run SCRIPT=02_stampede
  stampede:
    <<: *redis-base
    profiles: ["stampede"]
    command: >
      redis-server
      --maxmemory 64mb
      --loglevel notice
    volumes:
      - redis-stampede-data:/data

  # Profile: persistence-rdb - Exp 03A: Periodic RDB Snapshots
  # Limits: save 60 10000, appendonly no
  # Objective: Simulates SIGKILL crash to verify loss of in-flight writes since last snapshot
  # Runner: make up EXP=persistence-rdb && make run SCRIPT=03_persistence
  persistence-rdb:
    <<: *redis-base
    profiles: ["persistence-rdb", "persistence"]
    command: >
      redis-server
      --save 60 10000
      --appendonly no
      --loglevel notice
    volumes:
      - redis-persist-rdb-data:/data

  # Profile: persistence-aof - Exp 03B: AOF with appendfsync everysec
  # Limits: appendonly yes, appendfsync everysec
  # Objective: Tests production default durability capping crash data loss to last 1-second buffer
  # Runner: make up EXP=persistence-aof && make run SCRIPT=03_persistence
  persistence-aof:
    <<: *redis-base
    profiles: ["persistence-aof"]
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save ""
      --loglevel notice
    volumes:
      - redis-persist-aof-data:/data

  # Profile: persistence-always - Exp 03C: AOF with appendfsync always
  # Limits: appendonly yes, appendfsync always
  # Objective: Verifies zero data loss under SIGKILL crash at the expense of write throughput
  # Runner: make up EXP=persistence-always && make run SCRIPT=03_persistence
  persistence-always:
    <<: *redis-base
    profiles: ["persistence-always"]
    command: >
      redis-server
      --appendonly yes
      --appendfsync always
      --save ""
      --loglevel notice
    volumes:
      - redis-persist-always-data:/data

volumes:
  redis-eviction-lru-data:
  redis-eviction-noeviction-data:
  redis-eviction-lfu-data:
  redis-stampede-data:
  redis-persist-rdb-data:
  redis-persist-aof-data:
  redis-persist-always-data:
