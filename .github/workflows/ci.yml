name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Ruff check
        run: uvx ruff check .

      - name: Run Ruff format check
        run: uvx ruff format --check .

  compose-lint:
    name: Compose Lint (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configurations
        run: |
          for d in redis postgres clickhouse mongodb cassandra neo4j vault linux; do
            echo "Validating $d/docker-compose.yml..."
            (cd "$d" && docker compose --profile "*" config -q) || exit 1
          done
          echo "All compose configurations valid."
