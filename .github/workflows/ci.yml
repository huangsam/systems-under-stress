name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Run Ruff check
        run: uvx ruff check .

      - name: Run Ruff format check
        run: uvx ruff format --check .

  compose-lint:
    name: Compose Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Validate Compose configurations & invariants
        run: make compose-lint

  lab-e2e:
    name: Lab E2E (${{ matrix.lab }})
    needs: [python-lint, compose-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lab:
          - redis
          - postgres
          - clickhouse
          - mongodb
          - cassandra
          - vault
          - linux
          - chaos
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Run ${{ matrix.lab }} E2E experiments
        env:
          LAB: ${{ matrix.lab }}
        run: |
          set -euo pipefail
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::group::Failure Container Logs ($LAB)"
              (cd "$LAB" && docker compose --profile "*" ps -a) || true
              (cd "$LAB" && docker compose --profile "*" logs --tail=50) || true
              echo "::endgroup::"
            fi
            (cd "$LAB" && make clean) || true
          }
          trap cleanup EXIT

          make verify LAB="$LAB"
