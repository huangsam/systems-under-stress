x-mongo-base: &mongo-base
  image: ${MONGO_IMAGE:-mongo:9.0.4}
  restart: unless-stopped
  ports:
    - "127.0.0.1:27017:27017"
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 384M
  healthcheck:
    test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ping: 1})' --quiet"]
    interval: 2s
    timeout: 5s
    retries: 15
    start_period: 3s

services:
  # Profile: unindexed-sort - Exp 01: In-Memory Sort Limit
  # Limits: 100MB internal RAM sort ceiling
  # Objective: Tests blocking in-memory sort failures and remedies via allowDiskUse=true and B-Tree indexing
  # Runner: make up EXP=unindexed-sort && make run SCRIPT=01_sort_memory_limit
  unindexed-sort:
    <<: *mongo-base
    profiles: ["unindexed-sort"]
    volumes:
      - mongo-sort-data:/data/db

  # Profile: durability - Exp 02: Write Concern & Crash Durability
  # Limits: 384MB RAM, SIGKILL crash simulation
  # Objective: Compares write survival across w:0, w:1, and j:True
  # Runner: make up EXP=durability && make run SCRIPT=02_write_concern_crash
  durability:
    <<: *mongo-base
    profiles: ["durability"]
    volumes:
      - mongo-durability-data:/data/db

  # Profile: document-limits - Exp 03: 16MB BSON Document Cap & Array Growth
  # Limits: 16MB strict BSON document size boundary
  # Objective: Triggers BSONObjectTooLarge with unbounded $push; tests bucket pattern fix
  # Runner: make up EXP=document-limits && make run SCRIPT=03_document_size_cap
  document-limits:
    <<: *mongo-base
    profiles: ["document-limits"]
    volumes:
      - mongo-doclimit-data:/data/db

volumes:
  mongo-sort-data:
  mongo-durability-data:
  mongo-doclimit-data:
