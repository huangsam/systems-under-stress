# https://lefthook.dev/configuration/output.html
output:
  - failure
  - summary

# https://lefthook.dev/configuration/Hook.html
pre-commit:
  commands:
    python-lint:
      glob: "*.py"
      run: uvx ruff check --fix {staged_files} && uvx ruff format {staged_files}
      stage_fixed: true
    compose-lint:
      glob: "**/docker-compose.yml"
      run: make compose-lint
